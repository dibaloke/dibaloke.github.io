name: Validate site

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build production site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --strict_front_matter --trace
      - name: Check generated pages and assets
        run: python3 scripts/check_site.py
