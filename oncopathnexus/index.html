  /* Palette named for the stains on a pathology slide: hematoxylin, eosin, alcian blue, saffron, on clear glass. */
  :root { --glass: #f8f7fb; --ink: #231e3c; --muted: #6d6884; --faint: #9c98b0; --line: #e4e0ed; --hema: #4c4396; --eosin: #d6587f;
    --sans: "Instrument Sans", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; --serif: "Fraunces", "Iowan Old Style", Georgia, serif; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: radial-gradient(120% 95% at 50% 46%, #fcfbfd 0%, #f8f7fb 55%, #f2f0f7 100%) fixed var(--glass); color: var(--ink); overflow: hidden;
    font: 13.5px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: grab; touch-action: none; }
  canvas.dragging { cursor: grabbing; } canvas.pointing { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--hema); outline-offset: 3px; border-radius: 2px; }

  .title { position: fixed; top: 20px; left: 28px; pointer-events: none; }
  .title h1 { margin: 0; display: flex; align-items: center; gap: .3em; font: 500 clamp(30px, 3vw, 40px)/1 var(--serif); letter-spacing: -.025em; }
  .title h1 svg { width: 1.08em; height: 1.08em; flex: none; margin-top: .04em; overflow: visible; }
  .title h1 svg circle { mix-blend-mode: multiply; }

  .tools { position: fixed; top: 24px; right: 28px; display: flex; gap: 4px 18px; align-items: center; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100vw - 56px); }
  .btn { all: unset; box-sizing: border-box; padding: 5px 0; border-bottom: 1.5px solid transparent; color: var(--muted); font-weight: 500; cursor: pointer; }
  .btn:hover { color: var(--ink); }
  .btn:focus-visible { outline: 2px solid var(--hema); outline-offset: 3px; }
  .btn:disabled { cursor: default; }
  .modes { display: inline-flex; gap: 18px; padding-right: 18px; border-right: 1px solid var(--line); }
  .modes .btn[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .toggle::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1.3px currentColor; vertical-align: 1px; }
  .toggle[aria-pressed="true"] { color: var(--ink); } .toggle[aria-pressed="true"]::before { background: currentColor; }
  .map-search input { width: min(180px, 40vw); padding: 5px 0; border: 0; border-bottom: 1px solid #cdc8dc; border-radius: 0; background: transparent; font: inherit; color: var(--ink); outline: none; }
  .map-search input::placeholder { color: var(--faint); }
  .map-search input:focus { border-bottom-color: var(--ink); }

  .legend { position: fixed; left: 28px; bottom: 24px; display: flex; flex-direction: column; gap: 2px; max-width: 344px; }
  .chip { all: unset; box-sizing: border-box; display: inline-flex; align-items: center; gap: 9px; padding: 3px 0; width: fit-content; font-size: 12.5px; color: var(--ink); cursor: pointer; }
  .chip:focus-visible { outline: 2px solid var(--hema); outline-offset: 3px; }
  .chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
  .chip b { font-weight: 400; color: var(--faint); font-variant-numeric: tabular-nums; }
  .chip:hover { color: var(--hema); }
  .chip[aria-pressed="false"] { color: var(--faint); } .chip[aria-pressed="false"] i { background: transparent; box-shadow: inset 0 0 0 1.3px var(--faint); }
  .keys { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11.5px; line-height: 1.55; }
  .keys span { white-space: nowrap; margin-right: 12px; } .keys svg { vertical-align: middle; margin-right: 6px; }
  .keys div { margin-top: 5px; max-width: 40ch; }

  .panel { position: fixed; top: 72px; right: 28px; width: min(352px, calc(100vw - 56px)); max-height: calc(100vh - 100px); overflow: auto; padding: 20px 22px 18px;
    background: rgba(252,251,253,.97); border: 1px solid var(--line); border-radius: 5px; box-shadow: 0 18px 50px -24px rgba(35,30,60,.3); }
  .panel[hidden] { display: none; }
  .panel .seg { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .panel .seg i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .panel h2 { margin: 8px 26px 6px 0; font: 500 25px/1.12 var(--serif); letter-spacing: -.02em; }
  .panel .meta { color: var(--muted); font-size: 12.5px; line-height: 1.5; } .panel .meta span { display: block; }
  .panel .status { display: inline-block; margin-top: 10px; padding: 2px 8px; border-radius: 3px; background: #eeebf5; color: #4a4468; font-size: 12px; }
  .panel p { margin: 12px 0 0; line-height: 1.55; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
  .tags span { padding: 1px 8px; border: 1px solid var(--line); border-radius: 3px; font-size: 11.5px; color: #4a4468; }
  .panel h3 { margin: 18px 0 4px; font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .panel ul { list-style: none; margin: 0; padding: 0; }
  .panel li { padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .panel li button { all: unset; cursor: pointer; font-weight: 600; color: var(--ink); }
  .panel li button:hover { color: var(--hema); text-decoration: underline; text-underline-offset: 3px; }
  .panel li button:focus-visible { outline: 2px solid var(--hema); outline-offset: 2px; }
  .panel li small { display: block; color: var(--muted); font-size: 12px; }
  .panel li em { font-style: normal; color: var(--faint); font-size: 12px; margin-left: 8px; }
  .panel a.site { display: inline-block; margin-top: 14px; color: var(--hema); font-size: 13px; text-underline-offset: 3px; }
  .close { position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); font-size: 18px; cursor: pointer; }
  .close:hover { background: #eeebf5; color: var(--ink); }

  .veil { position: fixed; inset: 0 0 auto 0; height: 108px; pointer-events: none; opacity: 0; transition: opacity .2s; background: linear-gradient(rgba(248,247,251,.95) 64%, rgba(248,247,251,0)); }
  body.zoomed .veil { opacity: 1; } .foot { transition: opacity .2s; } body.zoomed .foot { opacity: 0; }
  .rail, .legend { padding: 8px 12px; margin: -8px -12px; border-radius: 6px; transition: background-color .2s; }
  body.zoomed .rail, body.zoomed .legend { background: rgba(248,247,251,.84); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .foot { position: fixed; right: 28px; bottom: 24px; color: var(--faint); font-size: 11.5px; text-align: right; pointer-events: none; }
  .panel:not([hidden]) ~ .foot { display: none; }
  .rail { position: fixed; left: 28px; top: 104px; display: flex; visibility: hidden; flex-direction: column; gap: 1px; font-size: 12.5px; }
  body[data-mode="layers"] .rail { visibility: visible; }
  .rail h4 { margin: 0 0 4px; font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .rail label { display: flex; align-items: center; gap: 8px; padding: 3px 8px 3px 0; cursor: pointer; color: var(--ink); width: fit-content; }
  .rail label:hover { color: var(--hema); }
  .rail input { width: 14px; height: 14px; accent-color: var(--hema); cursor: pointer; margin: 0; }
  .rail .lico { width: 17px; height: 17px; flex: none; }
  .rail label.off .lico { opacity: .35; }
  .panel .meta .lay::before, .panel .also b::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 7px; border-radius: 2px; background: var(--c); }
  .panel .also b { font-weight: 600; } .keys .onlyLayers { display: none; } body[data-mode="layers"] .keys .onlyLayers { display: inline; }
  .rail label b { font-weight: 400; color: var(--faint); font-variant-numeric: tabular-nums; }
  .rail label.off { color: var(--faint); }
  .rail .all { all: unset; margin-top: 6px; font-size: 12px; color: var(--hema); cursor: pointer; } .rail .all:hover { text-decoration: underline; text-underline-offset: 3px; }
  .rail .all:focus-visible { outline: 2px solid var(--hema); outline-offset: 3px; }

  .time { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 6px 16px 6px 6px; border-radius: 999px;
    background: rgba(248,247,251,.84); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .time .play { all: unset; box-sizing: border-box; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--glass); font-size: 9px; line-height: 26px; text-align: center; cursor: pointer; }
  .time .play:hover { background: var(--hema); }

  el.onmouseenter = () => { if (!layerOff.has(Lr.key)) { hotLayer = Lr; draw(); } }; el.onmouseleave = () => { if (hotLayer === Lr) { hotLayer = null; draw(); } }; });
document.getElementById("allLayers").onclick = () => { layerOff.clear(); rail.querySelectorAll("label").forEach(el => { el.classList.remove("off"); el.querySelector("input").checked = true; }); stackLayers(true); };

const yearInput = document.getElementById("year"), yearLabel = document.getElementById("yearLabel"), playBtn = document.getElementById("play");
function setYear(y) { T = Math.max(Y0, Math.min(Y1, +y)); yearInput.value = T;
  const shown = nodes.filter(n => n.year <= T).length, fresh = nodes.filter(n => n.year === T).length;
  yearLabel.innerHTML = `${T === Y0 ? "Up to 2010" : "Through " + T}<small>${shown} of ${nodes.length} shown${fresh && T > Y0 ? ", " + fresh + " new" : ""}</small>`; yearInput.style.setProperty("--fill", (T - Y0) / (Y1 - Y0) * 100 + "%");
  if (sel && sel.year > T) { sel = null; panel.hidden = true; } if (hover && hover.year > T) hover = null; draw(); kick(); }
yearInput.addEventListener("input", () => { stopPlay(); setYear(yearInput.value); });
function stopPlay() { if (playing) { clearInterval(playing); playing = 0; playBtn.textContent = "▶"; } }
playBtn.onclick = () => { if (playing) return stopPlay(); playBtn.textContent = "❚❚"; setYear(T >= Y1 ? Y0 : T + 1);
  playing = setInterval(() => { if (T >= Y1) stopPlay(); else setYear(T + 1); }, 1100); };
const controlsDialog = document.getElementById('map-controls-dialog'), controlsHome = document.getElementById('map-controls'), controlsToggle = document.getElementById('controls-toggle');
const controlGroups = [document.querySelector('.tools'), document.getElementById('time'), document.getElementById('legend'), document.getElementById('rail')];
controlsToggle.onclick = () => {
  [controlGroups[0], controlGroups[3], controlGroups[1], controlGroups[2]].forEach(group => document.getElementById('mobile-control-content').appendChild(group));
  controlsToggle.setAttribute('aria-expanded', 'true'); controlsDialog.showModal();
};
document.getElementById('controls-close').onclick = () => controlsDialog.close();
controlsDialog.addEventListener('close', () => {
  [controlGroups[0], controlGroups[3], controlGroups[2], controlGroups[1]].forEach(group => controlsHome.appendChild(group));
  controlsToggle.setAttribute('aria-expanded', 'false'); queueResize();
});
controlsDialog.addEventListener('keydown', e => { if (e.key === 'Escape') e.stopPropagation(); });
closeOnBackdrop(controlsDialog);
document.getElementById('zoom-in').onclick = () => zoom(1.25);
document.getElementById('zoom-out').onclick = () => zoom(.8);
document.getElementById('fit-map').onclick = fitView;
compactLayout.addEventListener('change', queueResize);

setYear(Y1);

resize(); kick();

/* ---------- Logo: the atlas in miniature. Stained dots sit on a slowly turning globe, tied by a few links, like the cloud itself. ---------- */
(() => { const svg = document.getElementById("logo"), NS = "http://www.w3.org/2000/svg", M = 18, R = 10.5, tilt = .42;
  const cols = ["#4c4396", "#d6587f", "#4c4396", "#d6587f", "#4c4396", "#1f8a9e", "#d6587f", "#4c4396", "#c28a1f"];
  const pts = Array.from({ length: M }, (_, i) => { const y = 1 - 2 * (i + .5) / M, r = Math.sqrt(1 - y * y), a = i * 2.39996; return { x: Math.cos(a) * r, y, z: Math.sin(a) * r, c: cols[i % cols.length], k: i % 5 === 0 ? 1.5 : 1 }; });
  const pairs = [[0, 3], [3, 8], [8, 5], [5, 13], [13, 10], [10, 16], [2, 7], [7, 12]];
  const mk = (tag, at) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); svg.appendChild(e); return e; };
  const lines = pairs.map(() => mk("line", { stroke: "#4c466e", "stroke-width": .45, "stroke-linecap": "round" })), dots = pts.map(q => mk("circle", { fill: q.c }));
  const ct = Math.cos(tilt), st = Math.sin(tilt);
  function frame(t) { const a = t * .00035, ca = Math.cos(a), sa = Math.sin(a);
    const v = pts.map(q => { const x = q.x * ca + q.z * sa, z = -q.x * sa + q.z * ca; return [x * R, (q.y * ct - z * st) * R, q.y * st + z * ct]; });
    dots.forEach((d, i) => { const [x, y, z] = v[i], f = (z + 1) / 2; d.setAttribute("cx", x.toFixed(2)); d.setAttribute("cy", y.toFixed(2)); d.setAttribute("r", ((1.05 + 1.15 * f) * pts[i].k).toFixed(2)); d.setAttribute("opacity", (.3 + .7 * f).toFixed(2)); });
    lines.forEach((l, i) => { const [p, q] = pairs[i], A = v[p], B = v[q]; l.setAttribute("x1", A[0].toFixed(2)); l.setAttribute("y1", A[1].toFixed(2)); l.setAttribute("x2", B[0].toFixed(2)); l.setAttribute("y2", B[1].toFixed(2)); l.setAttribute("opacity", (.12 + .3 * (A[2] + B[2] + 2) / 4).toFixed(2)); }); }
  frame(2400);
  const icon = document.createElement("link"); icon.rel = "icon"; icon.href = "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="${NS}" viewBox="-13 -13 26 26">${svg.innerHTML}</svg>`); document.head.appendChild(icon);   // the still frame doubles as the tab icon
  if (!calm) { const loop = t => { frame(t + 2400); requestAnimationFrame(loop); }; requestAnimationFrame(loop); } })();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fitLayers(); draw(); });   // measure and draw again once the embedded typefaces are ready
</script>
