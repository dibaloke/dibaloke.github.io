- id: explainability-graph-attack
  title: Explainability-Based Adversarial Attack on Graphs Through Edge Perturbation
  authors: Dibaloke Chanda, Saba Heidari Gheshlaghi, Nasim Yahya Soltani
  venue: Knowledge-Based Systems
  type: journal
  topic: graphs
  selected: true
  summary: An explainability-based approach to adversarial attacks on graphs through edge perturbation.
  highlights:
  - label: Big idea
    text: Explanations of a graph neural network's predictions can reveal which parts of the graph an adversary should target.
  - label: Method
    text: Use GNNExplainer and PGExplainer to identify important subgraphs, then perturb graph edges to construct adversarial test samples.
  - label: Finding
    text: Explanation-guided attacks can avoid complex attack optimization and training-time model access by exploiting information from a trained model.
  - label: Impact
    text: Reveals a security tradeoff in model transparency and motivates evaluating explainability alongside adversarial robustness.
  tags:
  - Explainability
  - Adversarial attacks
  - Graph learning
  - Edge perturbation
  links:
  - label: Paper
    url: https://www.sciencedirect.com/science/article/pii/S0950705124015296
  - label: arXiv
    url: https://arxiv.org/abs/2312.17301
  - label: Graphical abstract
    url: /assets/images/research/explainability-graph-attack.png
  year: 2025
  image: /assets/images/research/explainability-graph-attack.png
  image_width: 2400
